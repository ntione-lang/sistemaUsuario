```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Cadastro de Usuários</title>

  <!-- Bootstrap 5 -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <!-- Folha de estilos -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-body-tertiary">

  <main class="container py-5">

    <header class="mb-4">
      <h1 class="fw-bold">Cadastro de Usuários</h1>
      <p class="text-secondary">
        Cadastre, consulte e mantenha os dados salvos no banco de dados.
      </p>
    </header>

    <!-- Mensagens de sucesso e erro -->
    <div
      id="mensagem"
      class="alert d-none"
      role="status"
      aria-live="polite"
    ></div>

    <div class="row g-4">

      <!-- COLUNA ESQUERDA: FORMULÁRIO -->
      <section class="col-lg-4" aria-labelledby="titulo-formulario">

        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <h2 id="titulo-formulario" class="h5 mb-4">
              Novo Usuário
            </h2>

            <form id="formulario">

              <!-- Nome completo -->
              <div class="mb-3">
                <label for="nome" class="form-label">
                  Nome Completo
                </label>

                <input
                  id="nome"
                  name="nome"
                  class="form-control"
                  type="text"
                  placeholder="Ex: Maria Silva"
                  required
                  minlength="2"
                  maxlength="100"
                >
              </div>

              <!-- Codinome -->
              <div class="mb-3">
                <label for="codinome" class="form-label">
                  Codinome
                </label>

                <input
                  id="codinome"
                  name="codinome"
                  class="form-control"
                  type="text"
                  placeholder="Ex: Fênix"
                  required
                  minlength="2"
                  maxlength="50"
                >
              </div>

              <!-- Nível -->
              <div class="mb-3">
                <label for="nivel" class="form-label">
                  Nível
                </label>

                <select
                  id="nivel"
                  name="nivel"
                  class="form-select"
                  required
                >
                  <option value="">Selecione um nível</option>
                  <option value="Iniciante">Iniciante</option>
                  <option value="Especialista">Especialista</option>
                  <option value="Líder">Líder</option>
                </select>
              </div>

              <!-- E-mail -->
              <div class="mb-3">
                <label for="email" class="form-label">
                  E-mail
                </label>

                <input
                  id="email"
                  name="email"
                  class="form-control"
                  type="email"
                  placeholder="Ex: maria@email.com"
                  required
                  maxlength="150"
                >
              </div>

              <!-- Telefone -->
              <div class="mb-4">
                <label for="telefone" class="form-label">
                  Telefone
                  <span class="text-secondary">(opcional)</span>
                </label>

                <input
                  id="telefone"
                  name="telefone"
                  class="form-control"
                  type="tel"
                  placeholder="(11) 99999-9999"
                  maxlength="30"
                >
              </div>

              <!-- Botão cadastrar/atualizar -->
              <button
                id="salvar"
                class="btn btn-primary w-100"
                type="submit"
              >
                Cadastrar
              </button>

              <!-- Cancelar edição -->
              <button
                id="cancelar-edicao"
                class="btn btn-secondary w-100 mt-2 d-none"
                type="button"
              >
                Cancelar edição
              </button>

            </form>

          </div>
        </div>

      </section>

      <!-- COLUNA DIREITA: TABELA -->
      <section class="col-lg-8" aria-labelledby="titulo-tabela">

        <div class="card border-0 shadow-sm">
          <div class="card-body p-4">

            <div
              class="d-flex justify-content-between align-items-center mb-3"
            >
              <h2 id="titulo-tabela" class="h5 mb-0">
                Usuários Cadastrados
              </h2>

              <span id="total-usuarios" class="badge bg-secondary">
                0 usuários
              </span>
            </div>

            <div class="table-responsive">

              <table class="table table-hover align-middle mb-0">

                <thead class="table-light">
                  <tr>
                    <th scope="col">NOME</th>
                    <th scope="col">CODINOME</th>
                    <th scope="col">E-MAIL</th>
                    <th scope="col">TELEFONE</th>
                    <th scope="col">NÍVEL</th>
                    <th scope="col">AÇÕES</th>
                  </tr>
                </thead>

                <tbody id="tabela-usuarios">
                  <tr>
                    <td
                      colspan="6"
                      class="text-center text-secondary py-4"
                    >
                      Carregando usuários...
                    </td>
                  </tr>
                </tbody>

              </table>

            </div>
          </div>
        </div>

      </section>

    </div>
  </main>

  <script>
    // ENDEREÇO DA API
    const API_URL = "http://localhost:3000/api/usuarios";

    // ELEMENTOS DO HTML
    const formulario = document.getElementById("formulario");

    const inputNome = document.getElementById("nome");
    const inputCodinome = document.getElementById("codinome");
    const inputNivel = document.getElementById("nivel");
    const inputEmail = document.getElementById("email");
    const inputTelefone = document.getElementById("telefone");

    const btnSalvar = document.getElementById("salvar");
    const btnCancelar = document.getElementById("cancelar-edicao");

    const divMensagem = document.getElementById("mensagem");
    const tabelaUsuarios = document.getElementById("tabela-usuarios");
    const badgeTotal = document.getElementById("total-usuarios");

    // ID DO USUÁRIO EM EDIÇÃO
    let usuarioEditandoId = null;

    // EXIBIR MENSAGEM
    function exibirMensagem(texto, tipo = "success") {
      divMensagem.textContent = texto;
      divMensagem.className = `alert alert-${tipo}`;
      divMensagem.classList.remove("d-none");
    }

    // LIMPAR MENSAGEM
    function limparMensagem() {
      divMensagem.classList.add("d-none");
      divMensagem.textContent = "";
    }

    // PROTEGER A EXIBIÇÃO DOS DADOS COMO TEXTO
    function sanitizarHtml(texto) {
      const div = document.createElement("div");
      div.textContent = texto ?? "";
      return div.innerHTML;
    }

    // LER RESPOSTA DA API
    async function lerResposta(resposta) {
      const texto = await resposta.text();

      let dados = {};

      if (texto.trim() !== "") {
        try {
          dados = JSON.parse(texto);
        } catch {
          throw new Error(
            "O servidor não retornou JSON válido."
          );
        }
      }

      if (!resposta.ok) {
        throw new Error(
          dados.erro || `Erro do servidor: ${resposta.status}`
        );
      }

      return dados;
    }

    // 1. CARREGAR USUÁRIOS
    async function carregarUsuarios() {
      try {
        const resposta = await fetch(API_URL);
        const usuarios = await lerResposta(resposta);

        if (!Array.isArray(usuarios)) {
          throw new Error(
            "A API não retornou uma lista válida de usuários."
          );
        }

        renderizarTabela(usuarios);

      } catch (erro) {
        tabelaUsuarios.innerHTML = `
          <tr>
            <td colspan="6"
                class="text-center text-danger py-4">
              ${sanitizarHtml(erro.message)}
            </td>
          </tr>
        `;

        badgeTotal.textContent = "Indisponível";

        exibirMensagem(
          "Não foi possível carregar os usuários. Verifique se o servidor está ligado.",
          "danger"
        );
      }
    }

    // 2. MOSTRAR USUÁRIOS NA TABELA
    function renderizarTabela(usuarios) {
      badgeTotal.textContent =
        `${usuarios.length} usuário${usuarios.length === 1 ? "" : "s"}`;

      if (usuarios.length === 0) {
        tabelaUsuarios.innerHTML = `
          <tr>
            <td colspan="6"
                class="text-center text-secondary py-4">
              Nenhum usuário cadastrado.
            </td>
          </tr>
        `;
        return;
      }

      tabelaUsuarios.innerHTML = usuarios.map(usuario => `
        <tr>
          <td class="fw-medium">
            ${sanitizarHtml(usuario.nome)}
          </td>

          <td>
            ${sanitizarHtml(usuario.codinome || "-")}
          </td>

          <td>
            ${sanitizarHtml(usuario.email)}
          </td>

          <td>
            ${sanitizarHtml(usuario.telefone || "-")}
          </td>

          <td>
            ${sanitizarHtml(usuario.nivel || "-")}
          </td>

          <td>
            <div class="d-flex flex-wrap gap-2">

              <button
                type="button"
                class="btn btn-warning btn-sm"
                data-acao="editar"
                data-id="${Number(usuario.id)}"
              >
                Editar
              </button>

              <button
                type="button"
                class="btn btn-danger btn-sm"
                data-acao="excluir"
                data-id="${Number(usuario.id)}"
              >
                Excluir
              </button>

            </div>
          </td>
        </tr>
      `).join("");
    }

    // 3. PREPARAR FORMULÁRIO PARA EDIÇÃO
    async function editarUsuario(id) {
      try {
        const resposta = await fetch(API_URL);
        const usuarios = await lerResposta(resposta);

        if (!Array.isArray(usuarios)) {
          throw new Error("Lista de usuários inválida.");
        }

        const usuario = usuarios.find(
          item => Number(item.id) === id
        );

        if (!usuario) {
          throw new Error("Usuário não encontrado.");
        }

        inputNome.value = usuario.nome ?? "";
        inputCodinome.value = usuario.codinome ?? "";
        inputNivel.value = usuario.nivel ?? "";
        inputEmail.value = usuario.email ?? "";
        inputTelefone.value = usuario.telefone ?? "";

        usuarioEditandoId = id;

        btnSalvar.textContent = "Salvar alterações";
        btnCancelar.classList.remove("d-none");

        document.getElementById("titulo-formulario").textContent =
          "Editar Usuário";

        inputNome.focus();

        exibirMensagem(
          "Altere os dados e clique em Salvar alterações.",
          "info"
        );

      } catch (erro) {
        exibirMensagem(erro.message, "danger");
      }
    }

    // 4. CANCELAR EDIÇÃO
    function cancelarEdicao() {
      usuarioEditandoId = null;

      formulario.reset();

      btnSalvar.textContent = "Cadastrar";
      btnCancelar.classList.add("d-none");

      document.getElementById("titulo-formulario").textContent =
        "Novo Usuário";
    }

    btnCancelar.addEventListener("click", () => {
      cancelarEdicao();
      limparMensagem();
      inputNome.focus();
    });

    // 5. EXCLUIR USUÁRIO
    async function excluirUsuario(id, botao) {
      const confirmar = confirm(
        "Tem certeza de que deseja excluir este usuário?"
      );

      if (!confirmar) return;

      botao.disabled = true;

      try {
        const resposta = await fetch(`${API_URL}/${id}`, {
          method: "DELETE"
        });

        await lerResposta(resposta);

        if (usuarioEditandoId === id) {
          cancelarEdicao();
        }

        exibirMensagem(
          "Usuário excluído com sucesso!",
          "success"
        );

        await carregarUsuarios();

      } catch (erro) {
        exibirMensagem(erro.message, "danger");
        botao.disabled = false;
      }
    }

    // 6. BOTÕES EDITAR E EXCLUIR
    tabelaUsuarios.addEventListener("click", async (evento) => {
      const botao = evento.target.closest("button[data-acao]");

      if (!botao) return;

      const id = Number(botao.dataset.id);
      const acao = botao.dataset.acao;

      if (!Number.isSafeInteger(id) || id <= 0) {
        exibirMensagem("ID de usuário inválido.", "danger");
        return;
      }

      if (acao === "editar") {
        await editarUsuario(id);
      }

      if (acao === "excluir") {
        await excluirUsuario(id, botao);
      }
    });

    // 7. CADASTRAR OU ATUALIZAR USUÁRIO
    formulario.addEventListener("submit", async (evento) => {
      evento.preventDefault();

      if (!formulario.reportValidity()) {
        return;
      }

      const estaEditando = usuarioEditandoId !== null;

      const metodo = estaEditando ? "PUT" : "POST";

      const url = estaEditando
        ? `${API_URL}/${usuarioEditandoId}`
        : API_URL;

      // TODOS OS CAMPOS DO USUÁRIO
      const dadosUsuario = {
        nome: inputNome.value.trim(),
        codinome: inputCodinome.value.trim(),
        nivel: inputNivel.value,
        email: inputEmail.value.trim(),
        telefone: inputTelefone.value.trim()
      };

      btnSalvar.disabled = true;
      btnCancelar.disabled = true;

      btnSalvar.textContent = estaEditando
        ? "Salvando alterações..."
        : "Cadastrando...";

      limparMensagem();

      try {
        const resposta = await fetch(url, {
          method: metodo,

          headers: {
            "Content-Type": "application/json"
          },

          body: JSON.stringify(dadosUsuario)
        });

        await lerResposta(resposta);

        exibirMensagem(
          estaEditando
            ? "Usuário atualizado com sucesso!"
            : "Usuário cadastrado com sucesso!",
          "success"
        );

        cancelarEdicao();

        await carregarUsuarios();

        inputNome.focus();

      } catch (erro) {
        exibirMensagem(
          erro.message || "Erro ao processar os dados.",
          "danger"
        );

      } finally {
        btnSalvar.disabled = false;
        btnCancelar.disabled = false;

        btnSalvar.textContent =
          usuarioEditandoId !== null
            ? "Salvar alterações"
            : "Cadastrar";
      }
    });

    // 8. CARREGAR A LISTA QUANDO A PÁGINA ABRIR
    carregarUsuarios();
  </script>

</body>
</html>
```
